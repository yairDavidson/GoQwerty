<style>
:root{--bg:#dfe8cf;--fg:#1d2b14;--card:#fffdf4;--ac:#d9822b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10170c;--fg:#f1f3e6;--card:#222c1a;--ac:#f0a14a}}
:root[data-theme="dark"]{--bg:#10170c;--fg:#f1f3e6;--card:#222c1a;--ac:#f0a14a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{position:relative}
#c{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
:root{--ink:#1a0c10;--cf:'Secular One',system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#ov{background:radial-gradient(circle,rgba(0,0,0,.3) 1.4px,transparent 1.6px) 0 0/7px 7px,rgba(10,5,20,.72)}
.card{position:relative;background:radial-gradient(circle,rgba(217,130,43,.22) 1.3px,transparent 1.6px) 0 0/8px 8px,#fff6d8;color:var(--ink);border:4px solid var(--ink);border-radius:6px;padding:22px 18px 20px;max-width:340px;width:100%;text-align:center;box-shadow:8px 8px 0 var(--ink);transform:rotate(-1deg);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.card h2{margin:8px 0;font-family:var(--cf);font-weight:400;font-size:28px;line-height:1.1;color:#ffe14a;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 #ff2d55;transform:skewX(-6deg)}
.card p,.card .pp{margin:8px 0 14px;line-height:1.45;font-size:16px;font-weight:700}.card .pp:empty{display:none}
.pz{position:absolute;top:34px;right:8px;z-index:5;padding:3px 8px;font-size:18px;background:rgba(0,0,0,.55);color:#fff;border:2px solid #fff4;border-radius:10px;box-shadow:none;transform:none;font-family:system-ui}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(46px,14vw,62px),1fr));gap:8px;max-height:34vh;overflow-y:auto;padding:6px 4px;margin:6px 0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pi{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,8vw,34px);background:#fff;border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:5px;color:var(--ink);transform:none;font-family:system-ui}.pi .ic{width:100%;height:100%}
.pi.on{background:#ffe14a}
.pi b{position:absolute;right:-6px;bottom:-6px;background:#ff2d55;color:#fff;border:2px solid var(--ink);border-radius:9px;font-size:12px;min-width:20px;line-height:16px;font-family:system-ui}
.pd{min-height:46px;margin:4px 0 10px;padding:6px 10px;background:#fff;border:3px dashed var(--ink);border-radius:8px;font-weight:800;font-size:15px;line-height:1.35}
.big{font-size:54px;filter:drop-shadow(3px 3px 0 var(--ink))}.big:empty{display:none}
.burst{display:inline-block;font-family:var(--cf);font-size:34px;color:#fff;background:#ff2d55;padding:16px 30px;margin:2px 0 6px;transform:rotate(-4deg);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;filter:drop-shadow(4px 4px 0 var(--ink));clip-path:polygon(50% 0,60% 14%,78% 4%,80% 22%,98% 24%,88% 40%,100% 54%,84% 62%,92% 82%,72% 78%,64% 98%,50% 84%,36% 98%,28% 78%,8% 82%,16% 62%,0 54%,12% 40%,2% 24%,20% 22%,22% 4%,40% 14%)}
.cap{display:inline-block;font-family:var(--cf);font-size:20px;background:#ffe14a;color:var(--ink);border:3px solid var(--ink);padding:4px 14px;margin:6px 0 14px;transform:rotate(1.5deg);box-shadow:4px 4px 0 var(--ink)}
.big{font-size:54px}
button{font-family:var(--cf);font-weight:400;background:linear-gradient(#ffe14a,#ff9a1f);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:10px 26px;font-size:21px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transform:skewX(-6deg)}
button:active{transform:skewX(-6deg) translateY(3px);box-shadow:0 2px 0 var(--ink)}
.ab{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0;text-align:right;background:#fff;color:var(--ink);border:3px solid var(--ink);font-size:19px;transform:none;box-shadow:4px 4px 0 var(--ink)}
.ab:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.ab .at{display:block;flex:1}.ab .at b{display:block;font-family:var(--cf);font-weight:400;font-size:20px}.ab .ai{flex:none;display:block;width:46px;height:46px}.ic{display:block}.ab small{display:block;font-family:system-ui,Arial;font-weight:700;font-size:14px;opacity:.75}
.dots{margin-top:10px;letter-spacing:6px;color:var(--ink)}
#mu{display:none!important;position:absolute;top:34px;left:8px;z-index:5;padding:3px 8px;font-size:18px;box-shadow:none;transform:none;border:2px solid #fff4;background:rgba(0,0,0,.45);border-radius:10px}
#snd{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.55);color:#ffe9bf;padding:6px 14px;border-radius:16px;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
#intro{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 4.5vh) 0 calc(env(safe-area-inset-bottom,0px) + 18vh);pointer-events:none;z-index:4;text-align:center}
#tt{display:inline-block;font-size:clamp(24px,7.6vw,40px);white-space:nowrap;line-height:1;font-weight:900;color:#ffe14a;-webkit-text-stroke:8px #1a0c10;paint-order:stroke fill;text-shadow:5px 6px 0 #ff2d55,7px 9px 0 #1a0c10;transform:skewX(-8deg) rotate(-3deg);animation:drop .9s cubic-bezier(.2,1.5,.4,1) .3s both}
#ts{display:inline-block;margin-top:6px;font-size:clamp(13px,4vw,17px);font-weight:900;color:#fff;background:#ff2d55;border:3px solid #1a0c10;padding:2px 18px;letter-spacing:2px;transform:skewX(-8deg) rotate(-3deg);box-shadow:4px 4px 0 #1a0c10;animation:rise .6s ease 1.1s both}
#hs{margin-top:8px;font-size:14px;font-weight:800;color:#fff4c6;text-shadow:0 2px 0 #1a0c10,0 0 8px #000}
#bt{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
#nm{pointer-events:auto;width:min(70vw,270px);box-sizing:border-box;font:inherit;font-size:18px;font-weight:800;text-align:center;color:#fff;background:rgba(26,12,16,.72);border:3px solid #ffe14a;border-radius:14px;padding:9px 12px;outline:none;-webkit-user-select:text;user-select:text;touch-action:auto;animation:rise .6s ease 1.4s both}
#nm::placeholder{color:#cdb98a}
#go{pointer-events:auto;font-size:34px;font-weight:900;padding:8px 64px;border-radius:14px;border:4px solid #1a0c10;background:linear-gradient(#ffe14a,#ff9a1f);color:#2a0d00;box-shadow:0 7px 0 #1a0c10,0 0 26px #ff9a1f;transform:skewX(-6deg);animation:rise .6s ease 1.7s both,pulse 1.3s ease-in-out 2.4s infinite}
#sx{font-family:var(--cf);font-size:clamp(15px,4.6vw,19px);color:#1a0c10;background:#ffe14a;border:3px solid #1a0c10;padding:5px 14px;transform:rotate(-2.5deg);box-shadow:4px 4px 0 #1a0c10;animation:rise .6s ease 1.2s both;position:relative}
#sx{margin-top:14px;display:inline-block}
#cr{font-size:13px;font-weight:800;color:#fff4c6;text-shadow:0 2px 0 #1a0c10,0 0 8px #000;letter-spacing:.5px;margin-top:2px;animation:rise .6s ease 2.1s both}
#rc{pointer-events:auto;font-size:17px;padding:6px 24px;border-radius:12px;border:3px solid #1a0c10;background:#7a3cff;color:#fff;box-shadow:0 4px 0 #1a0c10;animation:rise .6s ease 1.9s both}
.rw{display:flex;gap:8px;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(128,128,128,.3);font-size:15px;text-align:right}.rw.me{background:rgba(255,200,60,.28);border-radius:8px;font-weight:800}.rw .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .pp{margin:8px 0 14px;line-height:1.5;font-size:16px}
@keyframes drop{from{transform:translateY(-170px) scale(1.7) skewX(-8deg) rotate(-3deg);opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{opacity:1}}
@keyframes pulse{50%{transform:skewX(-6deg) scale(1.08);box-shadow:0 7px 0 #1a0c10,0 0 44px #ffd24a}}
.mx{margin:8px 0 6px}.mr{display:flex;align-items:center;gap:10px;margin:7px 0;direction:ltr}.mr .ic{flex:none}.mr span{font-family:var(--cf);font-size:15px;width:64px;text-align:right;direction:rtl;flex:none}
.mr input{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;margin:0;touch-action:none;--p:100%}
.mr input::-webkit-slider-runnable-track{height:16px;border:3px solid #1a0c10;border-radius:9px;background:linear-gradient(#ff9a1f,#ff9a1f) 0/var(--p) 100% no-repeat,#fff;box-shadow:2px 2px 0 #1a0c10}
.mr input::-moz-range-track{height:10px;border:3px solid #1a0c10;border-radius:9px;background:#fff;box-shadow:2px 2px 0 #1a0c10}.mr input::-moz-range-progress{height:10px;background:#ff9a1f;border-radius:9px}
.mr input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#ffe14a;border:3px solid #1a0c10;box-shadow:2px 2px 0 #1a0c10}
.mr input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#ffe14a;border:3px solid #1a0c10}
#sb{font-size:17px;padding:8px 14px;margin:6px 0 8px;display:block;width:100%;background:linear-gradient(#9be86b,#3fae2a)}#sb.off{background:linear-gradient(#ff8a8a,#d22)}
#hm{font-size:17px;padding:8px 18px;margin-top:10px;background:linear-gradient(#fff,#cfe3ff)}
.rlist{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;margin:6px 0;border:3px solid #1a0c10;border-radius:8px;background:#fff}
